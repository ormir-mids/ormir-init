[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ormir-init"
version = "0.1.0"
description = "Create standardized project structures for ORMIR-MIDS imaging studies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

authors = [
    { name = "S. D. McGarry" }
]

keywords = [
    "medical imaging",
    "MIDS",
    "ORMIR",
    "musculoskeletal imaging",
    "research data management"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

[project.scripts]
ormir-init = "ormir_init.scaffold:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ormir_init = [
    "licenses/*.txt",
    "gitignore.txt"
]